# Publica cada versión de la app en el canal de Telegram de VoyPalGym: las novedades de la Release y un botón para
# descargarla desde voypalgym.com/descargar.
#
# Va en el repositorio PÚBLICO de las Releases (Angelggp/voypalgym-app), en .github/workflows/telegram.yml.
# Necesita dos secretos en ese repositorio (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  el token del bot (de @BotFather)
#   TELEGRAM_CHAT_ID    el canal: @nombre_del_canal (o su id numérico)
# El bot tiene que ser administrador del canal, con permiso para publicar.
# Guía: docs/procedimientos/telegram.md del repositorio privado.
name: Publicar en Telegram

on:
  release:
    types: [published]
  # Para repetir el aviso a mano (Actions → Publicar en Telegram → Run workflow)
  workflow_dispatch:
    inputs:
      tag:
        description: Versión a publicar (por ejemplo v1.3.0)
        required: true

jobs:
  telegram:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - name: Mandar las novedades al canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, urllib.error, urllib.request

          token, chat = os.environ["TELEGRAM_BOT_TOKEN"], os.environ["TELEGRAM_CHAT_ID"]
          if not token or not chat:
              sys.exit("Faltan los secretos TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID")

          # La Release. Al publicarla viene en el propio aviso de GitHub (sin consultar nada). Al repetirlo a mano se
          # busca: primero con la clave del workflow y, si falla, sin ella (el repositorio es público). Acepta
          # «1.3.0», «v1.3.0» o con espacios.
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          release = event.get("release")
          if not release:
              wanted = os.environ["TAG"].strip()
              wanted = wanted if wanted.lower().startswith("v") else f"v{wanted}"
              url = f"https://api.github.com/repos/{os.environ['REPO']}/releases?per_page=30"
              base = {"Accept": "application/vnd.github+json", "User-Agent": "voypalgym-telegram"}
              releases = None
              for headers in ({**base, "Authorization": f"Bearer {os.environ['GH_TOKEN']}"}, base):
                  try:
                      releases = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
                      break
                  except urllib.error.HTTPError as err:
                      print(f"GitHub respondió {err.code} al buscar las Releases; reintento sin clave")
              if releases is None:
                  sys.exit("GitHub no dejó leer las Releases. Prueba otra vez en unos minutos.")
              releases = [r for r in releases if not r.get("draft")]
              release = next((r for r in releases if r["tag_name"].lower() == wanted.lower()), None)
              if release is None:
                  sys.exit(f"No encuentro la Release {wanted}. Las publicadas son: {', '.join(r['tag_name'] for r in releases) or 'ninguna'}")
          title = release.get("name") or release["tag_name"]
          body = release.get("body") or ""

          # El Markdown de la Release, entero, pasado al HTML que entiende Telegram. Para un mensaje corto en el
          # canal, las novedades de la Release tienen que ser breves (ayuda/novedades.md)
          def to_html(md: str) -> str:
              out = []
              for line in md.replace("\r", "").split("\n"):
                  text = html.escape(line, quote=False)
                  text = re.sub(r"\[([^\]]+)\]\((https?://[^)\s]+)\)", r'<a href="\2">\1</a>', text)
                  text = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", text)
                  text = re.sub(r"`([^`]+)`", r"<code>\1</code>", text)
                  text = re.sub(r"^#{1,6}\s+(.*)$", r"<b>\1</b>", text)
                  text = re.sub(r"^\s*[-*]\s+", "• ", text)
                  out.append(text)
              return re.sub(r"\n{3,}", "\n\n", "\n".join(out)).strip()

          text = f"🆕 <b>{html.escape(title, quote=False)}</b>\n\n{to_html(body)}"
          if len(text) > 4000:
              text = text[:3990].rsplit("\n", 1)[0] + "\n…"

          # La foto, grande y encima del texto: la primera imagen adjunta a la Release (.png, .jpg, .webp) o, si no
          # hay, la de la web. Va como vista previa del mensaje, así cabe el texto entero (con foto y texto juntos,
          # Telegram solo deja 1 024 caracteres). Si no la puede cargar, el mensaje sale igual, sin foto.
          image = next(
              (a["browser_download_url"] for a in release.get("assets", []) if a["name"].lower().endswith((".png", ".jpg", ".jpeg", ".webp"))),
              "https://voypalgym.com/og.png",
          )
          print(f"Foto: {image}")

          payload = {
              "chat_id": chat,
              "text": text,
              "parse_mode": "HTML",
              "link_preview_options": {"url": image, "prefer_large_media": True, "show_above_text": True},
              "reply_markup": {"inline_keyboard": [[{"text": "📲 Descargar la app", "url": "https://voypalgym.com/descargar"}]]},
          }
          send = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              res = json.load(urllib.request.urlopen(send))
          except urllib.error.HTTPError as err:
              sys.exit(f"Telegram no aceptó el mensaje: {err.read().decode()[:300]}")
          print("Publicado en el canal" if res.get("ok") else f"Telegram respondió: {res}")
          PY
